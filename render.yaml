# SAC Sports Hub on Render (https://render.com/docs/blueprint-spec).
# No demo data is loaded (DEMO_DATA is off). The free plan has no persistent disk
# and sleeps after 15 idle minutes, so the database starts empty whenever the
# server restarts: activities added in /admin disappear then. For real use, run it
# on a server with a persistent disk (see Production in README.md).
services:
  - type: web
    name: badya-weekly-activities
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/auth/session
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: TRUST_PROXY
        value: "true"
      - key: DEMO_DATA
        value: "false"
      - key: ADMIN_EMAIL
        value: sports.admin@badyauni.edu.eg
      # Render generates a random password; it is shown under Environment in the dashboard.
      - key: ADMIN_PASSWORD
        generateValue: true
